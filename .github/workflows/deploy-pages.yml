name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare the complete site
        run: |
          mkdir -p public-site/turnos/brian public-site/turnos/antonella public-site/turnos/mirelle public-site/turnos/sardi
          cp index.html LOGO.png INDULIRU_CRUZ.png WSP_LOGO.png INSTA_LOGO.png GMAIL_LOGO.png MAPS_LOGO.png MERCADO_PAGO_LOGO.png CNAME public-site/
          cp -R dist/* public-site/turnos/
          cp LOGO.png WSP_LOGO.png INSTA_LOGO.png GMAIL_LOGO.png MERCADO_PAGO_LOGO.png public-site/turnos/
          cp dist/index.html public-site/turnos/brian/index.html
          cp dist/index.html public-site/turnos/antonella/index.html
          cp dist/index.html public-site/turnos/mirelle/index.html
          cp dist/index.html public-site/turnos/sardi/index.html
          rsync -a --exclude='.git' biblia/ public-site/biblia/
          cp dist/404.html public-site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - id: deployment
        uses: actions/deploy-pages@v4
